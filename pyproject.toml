[project]
name = "markitdown-gui"
version = "1.1.0"
description = "Interface grafica multiplataforma para converter documentos em Markdown usando o Microsoft MarkItDown"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Paulo Roberto Menezes", email = "paulomenezes.web@gmail.com" }]
keywords = ["markitdown", "markdown", "gui", "tkinter", "pdf", "converter", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jalawz/markitdown-gui"
Repository = "https://github.com/jalawz/markitdown-gui"
Issues = "https://github.com/jalawz/markitdown-gui/issues"

[project.scripts]
markitdown-gui = "markitdown_gui:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --timeout=180 --timeout-method=thread"
markers = [
    "slow: testes que demoram mais de 10 segundos",
]

[tool.coverage.run]
source = ["markitdown_gui"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
