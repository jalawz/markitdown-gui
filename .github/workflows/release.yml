name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex: 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: markitdown-gui-linux
          - os: windows-latest
            artifact: markitdown-gui-windows
          - os: macos-latest
            artifact: markitdown-gui-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "markitdown[all]"

      - name: Build executavel
        run: |
          pyinstaller --noconfirm --onefile --name markitdown-gui \
            --collect-all magika \
            --hidden-import=markitdown \
            markitdown_gui.py

      - name: Comprimir
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            zip -r markitdown-gui-windows.zip markitdown-gui.exe
          else
            tar -czf markitdown-gui-${{ runner.os }}.tar.gz markitdown-gui
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Binarios portateis

            Baixe o pacote do seu sistema operacional e execute:

            | SO | Arquivo |
            |---|---|
            | Windows | `markitdown-gui-windows.zip` |
            | Linux | `markitdown-gui-Linux.tar.gz` |
            | macOS | `markitdown-gui-macOS.tar.gz` |

            Nao requer instalacao de Python.
