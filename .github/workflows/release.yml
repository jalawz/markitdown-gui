name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: markitdown-gui-linux
          - os: windows-latest
            artifact: markitdown-gui-windows
          - os: macos-latest
            artifact: markitdown-gui-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install "markitdown[all]"

      - name: Build executavel
        run: |
          pyinstaller --noconfirm --onefile --name markitdown-gui --collect-all magika --hidden-import=markitdown --hidden-import=markitdown.converters markitdown_gui.py

      - name: Comprimir
        shell: bash
        run: python scripts/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Binarios portateis

            Baixe o pacote do seu sistema operacional e execute:

            | SO | Arquivo |
            |---|---|
            | Windows | `markitdown-gui-windows.zip` |
            | Linux | `markitdown-gui-Linux.tar.gz` |
            | macOS | `markitdown-gui-macOS.tar.gz` |

            Nao requer instalacao de Python.
